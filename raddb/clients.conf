# Os NAS (MikroTik) não ficam neste arquivo: vêm do banco (orion.nas), que o
# worker radius-sync do Orion mantém em dia. Qualquer IP pode mandar pacote;
# o servidor "dynamic_clients" procura a IP de origem em orion.nas e, se não
# achar, o pacote é ignorado. Equipo novo ou segredo novo vale em até 60 s,
# sem reiniciar o FreeRADIUS (lifetime = quanto tempo o NAS fica em cache).
client orion_nas_dinamicos {
	ipaddr = 0.0.0.0/0
	dynamic_clients = dynamic_clients
	lifetime = 60
}
