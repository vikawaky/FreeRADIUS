# Consultas do Orion: tudo passa por funções do schema `orion` (gravado pelo worker radius-sync do Orion) no Postgres.
# %{Packet-Src-IP-Address} = IP de origem do pacote; identifica o NAS e, por ele, o ISP.

safe_characters = "@abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789.-_: /"

sql_user_name = "%{User-Name}"

client_query = "SELECT id, nasname, shortname, type, secret, server FROM orion.clients()"

authorize_check_query = "\
	SELECT id, username, attribute, value, op \
	FROM orion.authorize_check('%{SQL-User-Name}', '%{Packet-Src-IP-Address}')"

authorize_reply_query = "\
	SELECT id, username, attribute, value, op \
	FROM orion.authorize_reply('%{SQL-User-Name}', '%{Packet-Src-IP-Address}')"

# Não usados (read_groups = no), mas o módulo exige que existam.
authorize_group_check_query = "SELECT NULL::int, NULL, NULL, NULL, NULL WHERE false"
authorize_group_reply_query = "SELECT NULL::int, NULL, NULL, NULL, NULL WHERE false"
group_membership_query = "SELECT NULL WHERE false"

accounting {
	reference = "%{tolower:type.%{%{Acct-Status-Type}:-%{Request-Processing-Stage}}.query}"

	column_list = ""

	type {
		start {
			query = "\
				SELECT orion.accounting( \
					'%{Acct-Status-Type}', '%{Acct-Unique-Session-Id}', '%{SQL-User-Name}', \
					'%{Packet-Src-IP-Address}', '%{NAS-Identifier}', '%{Framed-IP-Address}', \
					'%{Calling-Station-Id}', '%{Called-Station-Id}', \
					%{%{Acct-Session-Time}:-0}, \
					%{%{Acct-Input-Octets}:-0}, %{%{Acct-Input-Gigawords}:-0}, \
					%{%{Acct-Output-Octets}:-0}, %{%{Acct-Output-Gigawords}:-0}, \
					'%{Acct-Terminate-Cause}')"
		}
		interim-update {
			query = "${..start.query}"
		}
		stop {
			query = "${..start.query}"
		}
		accounting-on {
			query = "${..start.query}"
		}
		accounting-off {
			query = "${..start.query}"
		}
	}
}

post-auth {
	reference = ".query"
	query = "\
		SELECT orion.post_auth('%{SQL-User-Name}', '%{Packet-Src-IP-Address}', \
			'%{reply:Packet-Type}', '%{Calling-Station-Id}')"
}
